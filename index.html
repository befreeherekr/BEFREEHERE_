*{box-sizing:border-box;margin:0;padding:0}
:root{--kr:'Gowun Batang',serif;--serif:'Cormorant Garamond',serif;--gold:#E9D3A4}

.q{font-size:13px;letter-spacing:.16em;color:rgba(243,239,230,.9);padding-top:3px}
.c{display:flex;min-height:100svh}
.c a{position:relative;flex:1;display:flex;align-items:flex-end;padding:0 2.4rem 5rem;overflow:hidden;isolation:isolate;transition:flex .7s cubic-bezier(.2,.7,.2,1);-webkit-tap-highlight-color:transparent}
.c a+a{border-left:.5px solid rgba(243,239,230,.28)}
.c a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(.9) saturate(.95);transform:scale(1.001);transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .6s}
.c a::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,16,12,.18) 0%,rgba(20,16,12,0) 30%,rgba(20,16,12,.2) 55%,rgba(20,16,12,.74) 100%)}
.c a:hover,.c a:focus-visible{flex:1.4;outline:none}
.c a:hover img,.c a:focus-visible img{transform:scale(1.045);filter:brightness(1) saturate(1)}
.c h2{font-weight:400;font-size:clamp(28px,3vw,44px);letter-spacing:-.01em;line-height:1.2;margin-bottom:.7rem;text-shadow:0 2px 24px rgba(0,0,0,.45)}
