<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--kr:'Gowun Batang',serif;--serif:'Cormorant Garamond',serif;--gold:#E9D3A4}
html,body{height:100%}
body{font-family:var(--kr);background:#1a1713;color:#F3EFE6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{position:fixed;z-index:3;top:0;left:0;right:0;padding:1.6rem 4rem;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 1px 18px rgba(0,0,0,.55)}
.top::before{content:'';position:absolute;inset:0 0 -1.5rem 0;z-index:-1;background:linear-gradient(180deg,rgba(20,16,12,.5),rgba(20,16,12,0))}
.logo{display:flex;flex-direction:column;gap:2px;pointer-events:auto}
.logo-kr{font-size:17px;letter-spacing:.12em}
.logo-en{font-family:var(--serif);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.qw{display:flex;flex-direction:column;align-items:flex-end;gap:.5rem;pointer-events:auto}
.rd-link{font-size:12.5px;letter-spacing:.1em;color:var(--gold);border-bottom:.5px solid rgba(233,211,164,.55);padding-bottom:2px}
.q{font-size:13px;letter-spacing:.16em;color:rgba(243,239,230,.9);padding-top:3px}
.c{display:flex;min-height:100svh}
.c a{position:relative;flex:1;display:flex;align-items:flex-end;padding:0 2.4rem 5rem;overflow:hidden;isolation:isolate;transition:flex .7s cubic-bezier(.2,.7,.2,1);-webkit-tap-highlight-color:transparent}
.c a+a{border-left:.5px solid rgba(243,239,230,.28)}
.c a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:brightness(.9) saturate(.95);transform:scale(1.001);transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .6s}
.c a::before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(20,16,12,.18) 0%,rgba(20,16,12,0) 30%,rgba(20,16,12,.2) 55%,rgba(20,16,12,.74) 100%)}
.c a:hover,.c a:focus-visible{flex:1.4;outline:none}
.c a:hover img,.c a:focus-visible img{transform:scale(1.045);filter:brightness(1) saturate(1)}
.c h2{font-weight:400;font-size:clamp(28px,3vw,44px);letter-spacing:-.01em;line-height:1.2;margin-bottom:.7rem;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.c p{font-size:14px;line-height:1.8;color:rgba(243,239,230,.9);margin-bottom:1.3rem;text-shadow:0 1px 14px rgba(0,0,0,.5)}
.c span{display:inline-block;font-size:12.5px;letter-spacing:.12em;color:var(--gold);border-bottom:.5px solid rgba(233,211,164,.65);padding-bottom:4px;transition:letter-spacing .3s}
.c a:hover span{letter-spacing:.18em}
.c .s1 img{object-position:56% 50%}.c .s2 img{object-position:36% 50%}.c .s3 img{object-position:50% 40%}
@media(max-width:768px){
  .top{padding:1.2rem 1.4rem;flex-direction:column;gap:.55rem}
  .qw{align-items:flex-start}.q{font-size:11.5px;letter-spacing:.1em}
  .c{flex-direction:column}
  .c a{flex:1 1 33.34%;min-height:33.34svh;padding:0 1.4rem 1.5rem}
  .c a+a{border-left:0;border-top:.5px solid rgba(243,239,230,.28)}
  .c a:hover,.c a:focus-visible{flex:1 1 33.34%}
  .c a::before{background:linear-gradient(180deg,rgba(20,16,12,.08) 0%,rgba(20,16,12,.12) 40%,rgba(20,16,12,.7) 100%)}
  .c h2{font-size:25px;margin-bottom:.4rem}.c p{font-size:13px;margin-bottom:.7rem;line-height:1.6}
}
@media(prefers-reduced-motion:reduce){.c a,.c a img,.c span{transition:none}}
.c .s1{--k:#40361d}.c .s2{--k:#232320}.c .s3{--k:#3a281c}
.c a{background:var(--k)}
.c a img{inset:0 0 auto 0;height:62%;object-position:50% 40%}
.c a::before{background:linear-gradient(180deg,rgba(20,16,12,.1) 0%,rgba(0,0,0,0) 30%,color-mix(in srgb,var(--k) 70%,transparent) 48%,var(--k) 64%,var(--k) 100%)}
.c h2,.c p{text-shadow:none}
@media(max-width:768px){
 .c a img{inset:0 0 0 auto;width:60%;height:100%}
 .c a::before{background:linear-gradient(90deg,var(--k) 0%,var(--k) 42%,color-mix(in srgb,var(--k) 55%,transparent) 62%,rgba(0,0,0,0) 100%)}
}
.c .s1{--k:#ECEBE6;--h:#1B1A17;--p:rgba(27,26,23,.74);--l:#7D5F2A;--lb:rgba(125,95,42,.6)}
.c .s2{--k:#D9C6A3;--h:#1B1A17;--p:rgba(27,26,23,.76);--l:#6B4F24;--lb:rgba(107,79,36,.6)}
.c .s3{--k:#3a281c;--h:#F3EFE6;--p:rgba(243,239,230,.86);--l:#E9D3A4;--lb:rgba(233,211,164,.65)}
.c h2{color:var(--h)}.c p{color:var(--p)}.c span{color:var(--l);border-bottom-color:var(--lb)}
.c a+a{border-left-color:rgba(27,26,23,.14)}
.c .s3{border-left-color:rgba(27,26,23,.14)}
@media(max-width:768px){.c a+a{border-left:0;border-top:.5px solid rgba(27,26,23,.14)}}
.c a::before{background:linear-gradient(180deg,rgba(20,16,12,.18) 0%,rgba(20,16,12,0) 22%)!important}
.c a img{-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 38%,rgba(0,0,0,.55) 62%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,#000 38%,rgba(0,0,0,.55) 62%,transparent 100%);height:66%}
@media(max-width:768px){
 .c a::before{background:none!important}
 .c a img{height:100%;width:62%;-webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.6) 30%,#000 62%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.6) 30%,#000 62%)}
 .top::before{display:none}
 .logo{color:#1B1A17;text-shadow:none}.top{text-shadow:none}.logo-en{color:#7D5F2A}
}
.logo-en{color:#F1E0B8}@media(max-width:768px){.logo-en{color:#7D5F2A}}

/* ── 경계 있는 카드 시안 ── */
body{background:#1a1713}
.top::before{display:none}
.c{max-width:1180px;margin:0 auto;padding:6.5rem 3rem 3.5rem;gap:1.4rem;align-items:center;min-height:100svh}
.c a{flex:1 1 0;height:min(66svh,540px);min-height:420px;padding:0 1.9rem 2.2rem;border:.5px solid rgba(233,211,164,.34);border-radius:2px;box-shadow:0 18px 40px -22px rgba(0,0,0,.6)}
.c a+a{border-left:.5px solid rgba(233,211,164,.34)}
.c .s3{border-left-color:rgba(233,211,164,.34)}
.c a:hover,.c a:focus-visible{flex:1 1 0;border-color:rgba(233,211,164,.7);transform:translateY(-4px)}
.c a{transition:transform .5s cubic-bezier(.2,.7,.2,1),border-color .4s}
.c h2{font-size:clamp(24px,2.2vw,32px)}
@media(max-width:768px){
 .logo{color:#F3EFE6!important}.logo-en{color:#F1E0B8!important}
 .c{padding:5.4rem 1.1rem 1.6rem;gap:.9rem;align-items:stretch}
 .c a{flex:none;height:auto;min-height:0;aspect-ratio:16/8.2;padding:0 1.2rem 1.15rem}
 .c a+a{border-top:.5px solid rgba(233,211,164,.34)}
 .c a:hover,.c a:focus-visible{flex:none;transform:none}
 .c h2{font-size:23px}
}

/* ── v3: 처음 시안(사진이 번지는 모양) + 밝기 정리 ── */
.c .s1{--k:#CFC8B7;--p:rgba(27,26,23,.8);--l:#5E4520;--lb:rgba(94,69,32,.6)}
.c .s2{--k:#BDA37A;--p:rgba(27,26,23,.82);--l:#4F3A18;--lb:rgba(79,58,24,.6)}
.c .s3{--k:#3a281c}
.c a img{height:68%!important;filter:brightness(.9) saturate(.95);
 -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 52%,rgba(0,0,0,.8) 62%,rgba(0,0,0,.45) 74%,rgba(0,0,0,.16) 86%,transparent 97%);
 mask-image:linear-gradient(180deg,#000 0%,#000 52%,rgba(0,0,0,.8) 62%,rgba(0,0,0,.45) 74%,rgba(0,0,0,.16) 86%,transparent 97%)}
.c a:hover img{filter:brightness(.98) saturate(1)}
.c a::before{background:none!important}
@media(max-width:768px){
 html,body{height:auto}
 .c{height:100svh;min-height:0;padding:4.4rem 1rem 1rem;gap:.75rem}
 .c a{flex:1 1 0!important;height:auto!important;min-height:0!important;aspect-ratio:auto!important;padding:0 1.2rem 1rem}
 .c a img{height:100%!important;width:62%!important;inset:0 0 0 auto!important;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.18) 16%,rgba(0,0,0,.5) 34%,rgba(0,0,0,.85) 54%,#000 72%)!important;
  mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.18) 16%,rgba(0,0,0,.5) 34%,rgba(0,0,0,.85) 54%,#000 72%)!important}
 .c h2{font-size:22px}.c p{font-size:12.5px}
}
</style>
